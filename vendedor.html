<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#333f2b">
<title>Bhadram Vendas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   BHADRAM — Tema visual (PROVISÓRIO)
   Troque só estas variáveis quando o logo/cores reais chegarem.
   ========================================================================== */
:root{
  --brand:#5c7a4f;            /* dourado/âmbar - cor de destaque */
  --brand-2:#425a37;
  --brand-soft:#e9f0e3;
  --ink:#333f2b;             /* espresso - texto/fundo escuro */
  --ink-2:#48583c;
  --bg:#f6f4ec;              /* creme - fundo geral */
  --card:#ffffff;
  --line:#e3e6da;
  --muted:#87897a;
  --text:#333f2b;
  --ok:#3f8f5f;
  --ok-soft:#e4f2e9;
  --warn:#b98a2a;
  --warn-soft:#f8efd9;
  --danger:#c0503f;
  --info:#3f6f8f;
  --shadow:0 8px 30px rgba(42,33,28,.10);
  --shadow-sm:0 2px 10px rgba(42,33,28,.07);
  --r:18px;
  --r-sm:12px;
  --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:'Manrope',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);
  font-size:16px;line-height:1.45;
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{font-family:'Cormorant Garamond',serif;font-weight:700;letter-spacing:.2px;margin:0}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
img{max-width:100%;display:block}
a{color:var(--brand-2)}

/* ---- App shell: moldura de celular ---- */
#app{max-width:460px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;overflow-x:hidden}
.screen{display:none;padding-bottom:calc(88px + var(--safe-b));animation:fade .25s ease}
.screen.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---- Cabeçalho ---- */
.topbar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 14px;display:flex;align-items:center;gap:12px}
.topbar .logo{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:22px;letter-spacing:2px;line-height:1}
.topbar .logo small{display:block;font-family:'Manrope';font-weight:600;font-size:9px;letter-spacing:4px;color:#a9c48f;opacity:.95;margin-top:2px}
.topbar .sub{font-size:12.5px;color:#c7d3ba;margin-left:auto;text-align:right;line-height:1.2}
.topbar .back{font-size:22px;width:30px;margin-left:-6px}
.topbar h2{font-size:24px;color:#fff}

/* ---- Conteúdo ---- */
.wrap{padding:16px 16px 8px}
.section-title{font-size:13px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--muted);margin:22px 4px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.pad{padding:16px}

/* ---- Botões ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;
  padding:15px 18px;border-radius:14px;font-weight:700;font-size:15.5px;transition:.15s;user-select:none}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--brand);color:#fff;box-shadow:0 6px 18px rgba(92,122,79,.35)}
.btn-dark{background:var(--ink);color:#fff}
.btn-ghost{background:var(--brand-soft);color:var(--ink-2)}
.btn-outline{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-wa{background:#25D366;color:#fff;box-shadow:0 6px 18px rgba(37,211,102,.35)}
.btn-sm{width:auto;padding:9px 14px;font-size:13.5px;border-radius:11px}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---- Inputs ---- */
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-2);margin:0 2px 6px;letter-spacing:.3px}
.field input,.field select,.field textarea{width:100%;padding:14px 14px;border:1.5px solid var(--line);
  border-radius:13px;background:#fff;color:var(--text);outline:none;transition:.15s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(92,122,79,.15)}
.field textarea{resize:vertical;min-height:70px}
.field .hint{font-size:11.5px;color:var(--muted);margin:5px 2px 0}

/* ---- Badges/Status ---- */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:999px;letter-spacing:.3px}
.b-pend{background:var(--warn-soft);color:#9a721b}
.b-env{background:#e3edf4;color:#2f5f7c}
.b-rec{background:var(--ok-soft);color:#2b6b45}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor}

/* ---- Login ---- */
#login{background:linear-gradient(160deg,#28331f 0%,#333f27 52%,#3e4d2c 100%);min-height:100vh;min-height:100dvh;
  display:flex;flex-direction:column;justify-content:center;padding:32px 26px;color:#fff}
#login .brand{text-align:center;margin-bottom:34px}
#login .brand .mark{font-family:'Cormorant Garamond',serif;font-size:52px;font-weight:700;letter-spacing:4px;line-height:1}
#login .brand .tag{font-size:11px;letter-spacing:7px;color:#a9c48f;font-weight:600;margin-top:6px}
#login .brand .sys{font-size:12.5px;color:#c3d1b3;margin-top:14px;letter-spacing:1px}
#login .lcard{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:22px;padding:24px 20px;backdrop-filter:blur(6px)}
#login .field label{color:#e7dccb}
#login .field input{background:rgba(255,255,255,.94);border-color:transparent}
#login .err{color:#ffb4a6;font-size:13px;text-align:center;min-height:18px;margin-bottom:6px}
#login .hintbox{margin-top:18px;font-size:12px;color:#aebb9c;text-align:center;line-height:1.6}

/* ---- Home ---- */
.hero-hello{padding:4px 4px 2px}
.hero-hello .hi{font-size:15px;color:var(--muted);font-weight:600}
.hero-hello .nm{font-size:30px;color:var(--ink);line-height:1.1;margin-top:2px}
.stat-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow-sm)}
.stat .k{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.4px}
.stat .v{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;color:var(--ink);margin-top:3px;line-height:1}
.stat.gold{background:linear-gradient(150deg,var(--ink),#4a5c30);border-color:transparent;color:#fff}
.stat.gold .k{color:#d8c6ad}.stat.gold .v{color:#fff}
.stat.gold .v b{color:#a9c48f}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.qbtn{display:flex;flex-direction:column;gap:8px;align-items:flex-start;background:var(--card);border:1px solid var(--line);
  border-radius:var(--r);padding:16px;box-shadow:var(--shadow-sm);text-align:left;transition:.15s}
.qbtn:active{transform:scale(.98)}
.qbtn .ic{font-size:22px}
.qbtn .t{font-weight:800;font-size:15px;color:var(--ink)}
.qbtn .d{font-size:12px;color:var(--muted);font-weight:500}

/* ---- Catálogo ---- */
.search{display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:2px 0 4px}
.search input{border:none;outline:none;width:100%;background:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:8px 15px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:13px;font-weight:700;color:var(--ink-2)}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.prod-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:8px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow-sm);transition:.15s}
.pcard:active{transform:scale(.98)}
.pcard .ph{aspect-ratio:1/1;width:100%;object-fit:cover;background:var(--brand-soft)}
.pcard .pb{padding:11px 12px 13px}
.pcard .cat{font-size:10.5px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--brand-2)}
.pcard .nm{font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.2;margin:3px 0 7px;min-height:35px}
.pcard .pr{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:700;color:var(--ink)}
.pcard .st{font-size:11px;color:var(--muted);font-weight:600;margin-top:2px}

/* ---- Detalhe produto ---- */
.pd-img{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--brand-soft)}
.pd-body{padding:18px 18px 0}
.qty{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:13px;overflow:hidden;width:fit-content}
.qty button{width:46px;height:46px;font-size:22px;font-weight:700;color:var(--ink);background:#fff}
.qty .n{width:54px;text-align:center;font-weight:800;font-size:17px}

/* ---- Lista genérica ---- */
.list-item{display:flex;align-items:center;gap:13px;padding:14px 16px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm);margin-bottom:11px}
.list-item:active{transform:scale(.99)}
.avatar{width:46px;height:46px;border-radius:14px;background:var(--brand-soft);color:var(--brand-2);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:17px;flex-shrink:0;font-family:'Cormorant Garamond',serif}
.li-main{flex:1;min-width:0}
.li-main .t{font-weight:700;color:var(--ink);font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-main .s{font-size:12.5px;color:var(--muted);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li-end{text-align:right;flex-shrink:0}
.li-end .val{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:19px;color:var(--ink)}
.chev{color:var(--muted);font-size:20px;flex-shrink:0}

/* ---- Carrinho / pedido ---- */
.cart-line{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.cart-line:last-child{border-bottom:none}
.cart-line img{width:54px;height:54px;border-radius:12px;object-fit:cover;background:var(--brand-soft)}
.summary{display:flex;justify-content:space-between;padding:7px 0;font-size:14.5px;color:var(--ink-2)}
.summary.total{border-top:1.5px dashed var(--line);margin-top:6px;padding-top:14px;font-weight:800;font-size:17px;color:var(--ink)}
.summary.total b{font-family:'Cormorant Garamond',serif;font-size:26px}

/* ---- Pagamento ---- */
.pay-opt{display:flex;align-items:center;gap:14px;padding:16px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;margin-bottom:12px;transition:.15s}
.pay-opt.sel{border-color:var(--brand);box-shadow:0 0 0 3px rgba(92,122,79,.15)}
.pay-opt .ic{width:46px;height:46px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;background:var(--brand-soft)}
.pay-opt .t{font-weight:800;color:var(--ink);font-size:15.5px}
.pay-opt .d{font-size:12.5px;color:var(--muted)}
.pay-opt .rd{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;position:relative}
.pay-opt.sel .rd{border-color:var(--brand)}
.pay-opt.sel .rd:after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--brand)}
.pix-box{background:var(--brand-soft);border-radius:var(--r);padding:16px;text-align:center;margin-top:6px}
.pix-box .key{font-weight:800;font-size:16px;color:var(--ink);word-break:break-all;margin:8px 0}
.pix-qr{width:150px;height:150px;margin:10px auto;background:#fff;border-radius:12px;padding:10px}

/* ---- Recibo / sucesso ---- */
.success-hero{text-align:center;padding:34px 20px 10px}
.success-hero .ring{width:88px;height:88px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:flex;align-items:center;justify-content:center;font-size:44px;margin:0 auto 14px}
.success-hero h2{font-size:28px;color:var(--ink)}
.success-hero p{color:var(--muted);margin-top:4px}
.receipt{border:1px dashed var(--line);border-radius:var(--r);padding:18px;background:#fff}
.receipt .rr{display:flex;justify-content:space-between;font-size:14px;padding:5px 0;color:var(--ink-2)}
.receipt .rr b{color:var(--ink)}

/* ---- Bottom nav ---- */
.tabbar{position:fixed;bottom:0;left:0;right:0;max-width:460px;margin:0 auto;background:rgba(255,255,255,.94);
  backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:space-around;
  padding:9px 6px calc(9px + var(--safe-b));z-index:30}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;padding:4px;color:var(--muted);font-size:10.5px;font-weight:700}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.active{color:var(--brand)}
.tab .fabish{margin-top:-2px}

/* ---- Misc ---- */
.empty{text-align:center;padding:50px 24px;color:var(--muted)}
.empty .ic{font-size:44px;opacity:.5}
.empty .t{font-weight:700;color:var(--ink-2);margin-top:10px;font-size:16px}
.empty .d{font-size:13.5px;margin-top:4px}
.floaty{position:fixed;bottom:calc(92px + var(--safe-b));right:calc(50% - 230px + 16px);z-index:25}
@media(max-width:492px){.floaty{right:16px}}
.fab{width:56px;height:56px;border-radius:50%;background:var(--brand);color:#fff;font-size:30px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(92,122,79,.5)}
.toast{position:fixed;left:50%;bottom:calc(100px + var(--safe-b));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-size:14px;font-weight:600;z-index:60;box-shadow:var(--shadow);opacity:0;transition:.25s;pointer-events:none;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.sheet-mask{position:fixed;inset:0;background:rgba(20,15,12,.5);z-index:50;opacity:0;pointer-events:none;transition:.2s}
.sheet-mask.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-width:460px;margin:0 auto;background:var(--bg);border-radius:24px 24px 0 0;z-index:51;transform:translateY(100%);transition:.28s cubic-bezier(.2,.8,.2,1);max-height:88vh;overflow-y:auto;padding-bottom:calc(20px + var(--safe-b))}
.sheet.show{transform:translateY(0)}
.sheet .sh-head{position:sticky;top:0;background:var(--bg);padding:16px 18px 8px;display:flex;align-items:center}
.sheet .grip{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:40px;height:4px;border-radius:2px;background:var(--line)}
.sheet h3{font-size:22px;color:var(--ink)}
.sheet .cls{margin-left:auto;font-size:26px;color:var(--muted);width:32px;text-align:right}
.cust-pick{display:flex;align-items:center;gap:12px;padding:13px 15px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;width:100%;margin-bottom:10px;text-align:left}
.cust-pick.sel{border-color:var(--brand);background:var(--brand-soft)}
hr.soft{border:none;border-top:1px solid var(--line);margin:16px 0}
.pill-total{position:sticky;bottom:calc(90px + var(--safe-b));margin:14px 0 0}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div id="app"><!-- telas injetadas via JS --></div>
<div class="sheet-mask" id="mask" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

/* ==========================================================================

   --------------------------------------------------------------------------
   ARQUITETURA: toda leitura/gravação passa pelo objeto DB (camada de dados).
   Hoje ele usa localStorage. Para ligar num servidor no futuro, basta
   reescrever os métodos de DB para chamar a API — as telas não mudam.
   ========================================================================== */

/* ==========================================================================
   CONEXÃO COM O SUPABASE (banco de dados na nuvem)
   ========================================================================== */
const BHADRAM_CONFIG = {
  SUPABASE_URL: "https://nnkmkcrluplwvrkyswqs.supabase.co",
  SUPABASE_KEY: "sb_publishable_m3Pa8g2-mC-ASC6HDK5Jxw_2Tl5Zxzr"
};
const SB = window.supabase.createClient(BHADRAM_CONFIG.SUPABASE_URL, BHADRAM_CONFIG.SUPABASE_KEY);

// Metadados visuais dos produtos (cor/descrição) — preços vêm do banco
const PRODMETA = {
  vela:{cor:'#c79a5b',desc:'Vela perfumada de cera vegetal. Escolha o tamanho e o aroma.'},
  homespray:{cor:'#89b4c4',desc:'Spray aromatizador de ambientes. Escolha o tamanho e o aroma.'},
  varetas:{cor:'#9184c0',desc:'Difusor de varetas para perfumar o ambiente por semanas. 240ml.'},
  sabonete:{cor:'#8aa06a',desc:'Sabonete líquido perfumado com óleos essenciais. 240ml.'},
  escalda:{cor:'#7fa15a',desc:'Sais para escalda-pés relaxante. 100g.'}
};

// mapeia status do banco -> status usado nas telas
function uiStatus(db){ return db==='enviado' ? 'enviado' : (db==='entregue' ? 'recebido' : 'pendente'); }
function ts(v){ return v ? new Date(v).getTime() : null; }

// cache em memória (as telas leem daqui, de forma síncrona)
const C = { settings:null, seller:null, products:[], clients:[], orders:[] };

function mapCliente(r){ return {id:r.id, sellerId:r.vendedor_id, nome:r.nome, telefone:r.telefone||'', doc:r.documento||'', endereco:r.endereco||'', obs:r.obs||'', createdAt:ts(r.criado_em)}; }
function mapPedido(r){
  const items=(r.pedido_itens||[]).map(i=>({productId:i.produto_id, nome:i.produto_nome, tamanho:i.tamanho, aroma:i.aroma, preco:Number(i.preco), qty:i.qtd}));
  return {id:r.id, codigo:r.codigo, sellerId:r.vendedor_id, clientId:r.cliente_id, items, total:Number(r.total),
          pagamento:r.pagamento, status:uiStatus(r.status), dbStatus:r.status, pago:r.pago,
          createdAt:ts(r.criado_em), enviadoAt:ts(r.enviado_em), recebidoAt:ts(r.entregue_em)};
}

const DB = {
  // ---- getters (síncronos, leem o cache) ----
  settings(){ return C.settings || {expedicao:[],pixChave:'',pixNome:'',cartaoInfo:'',empresa:'Bhadram'}; },
  currentSeller(){ return C.seller; },
  products(){ return C.products; },
  product(id){ return C.products.find(p=>p.id===id); },
  clients(){ return C.clients.slice().sort((a,b)=>b.createdAt-a.createdAt); },
  client(id){ return C.clients.find(c=>c.id===id); },
  orders(){ return C.orders.slice().sort((a,b)=>b.createdAt-a.createdAt); },
  order(id){ return C.orders.find(o=>o.id===id); },

  // ---- autenticação ----
  async signIn(email, senha){
    const {data,error}=await SB.auth.signInWithPassword({email:email.trim(), password:senha});
    if(error) return {error: error.message};
    const {data:perfil}=await SB.from('perfis').select('*').eq('id',data.user.id).single();
    C.seller={id:data.user.id, nome:(perfil&&perfil.nome)||data.user.email, papel:perfil&&perfil.papel};
    return {ok:true};
  },
  async restoreSession(){
    const {data}=await SB.auth.getSession();
    if(data && data.session){
      const u=data.session.user;
      const {data:perfil}=await SB.from('perfis').select('*').eq('id',u.id).single();
      C.seller={id:u.id, nome:(perfil&&perfil.nome)||u.email, papel:perfil&&perfil.papel};
      return true;
    }
    return false;
  },
  async signOut(){ await SB.auth.signOut(); C.seller=null; C.clients=[]; C.orders=[]; },

  // ---- carga de dados ----
  async loadAll(){
    // config
    const {data:cfg}=await SB.from('config').select('*');
    const map={}; (cfg||[]).forEach(r=>map[r.chave]=r.valor);
    const pix=map.pix||{};
    C.settings={ empresa:map.empresa||'Bhadram', expedicao:map.expedicao||[],
      pixChave:pix.chave||'', pixNome:pix.nome||'Bhadram', pixCidade:pix.cidade||'',
      cartaoInfo:map.cartao||'', comissaoRegra:'5% até R$ 1.000 no mês • 8% acima (por total mensal)' };
    // produtos + tamanhos
    const {data:prods}=await SB.from('produtos').select('id,nome,categoria,ordem,tamanhos(rotulo,preco)').order('ordem');
    C.products=(prods||[]).map(p=>({ id:p.id, nome:p.nome, cat:p.categoria,
      cor:(PRODMETA[p.id]||{}).cor||'#b8894b', desc:(PRODMETA[p.id]||{}).desc||'',
      tamanhos:(p.tamanhos||[]).map(t=>({t:t.rotulo,preco:Number(t.preco)})).sort((a,b)=>a.preco-b.preco) }));
    // clientes (RLS já limita aos meus)
    const {data:cli}=await SB.from('clientes').select('*');
    C.clients=(cli||[]).map(mapCliente);
    // pedidos + itens (RLS já limita aos meus)
    const {data:ped}=await SB.from('pedidos').select('*, pedido_itens(*)');
    C.orders=(ped||[]).map(mapPedido);
  },

  // ---- mutações ----
  async addClient(c){
    const {data,error}=await SB.from('clientes').insert({
      vendedor_id:C.seller.id, nome:c.nome, telefone:c.telefone, documento:c.doc||null,
      endereco:c.endereco||null, obs:c.obs||null }).select().single();
    if(error){ toast('Erro ao salvar cliente'); return null; }
    const m=mapCliente(data); C.clients.push(m); return m;
  },
  async addOrder(o){
    const {data:ped,error}=await SB.from('pedidos').insert({
      vendedor_id:C.seller.id, cliente_id:o.clientId, total:o.total, pagamento:o.pagamento, status:'novo' }).select().single();
    if(error){ toast('Erro ao salvar pedido'); return null; }
    const itens=o.items.map(i=>({pedido_id:ped.id, produto_id:i.productId, produto_nome:i.nome, tamanho:i.tamanho, aroma:i.aroma, preco:i.preco, qtd:i.qty}));
    const {error:e2}=await SB.from('pedido_itens').insert(itens);
    if(e2){ toast('Erro ao salvar itens'); }
    const full={...ped, pedido_itens:itens.map(i=>({produto_id:i.produto_id,produto_nome:i.produto_nome,tamanho:i.tamanho,aroma:i.aroma,preco:i.preco,qtd:i.qtd}))};
    const m=mapPedido(full); C.orders.push(m); return m;
  },
  async updateOrder(id,patch){
    const upd={};
    if(patch.status==='enviado'){ upd.status='enviado'; upd.enviado_em=new Date().toISOString(); }
    if(patch.status==='recebido'){ upd.status='entregue'; upd.entregue_em=new Date().toISOString(); }
    const {data,error}=await SB.from('pedidos').update(upd).eq('id',id).select('*, pedido_itens(*)').single();
    if(error){ toast('Erro ao atualizar pedido'); return DB.order(id); }
    const m=mapPedido(data); const i=C.orders.findIndex(x=>x.id===id); if(i>=0) C.orders[i]=m; else C.orders.push(m);
    return m;
  }
}

const AROMAS=[
  {nome:'Lavanda', cor:'#9184c0'},
  {nome:'Capim Limão', cor:'#8aa06a'},
  {nome:'Pera Imperial', cor:'#bcae5a'},
  {nome:'Flor de Cerejeira', cor:'#d98aa2'},

];
const aromaColor=n=>{ const a=AROMAS.find(x=>x.nome===n); return a?a.cor:'#b8894b'; };
/* Comissão por faixa de valor da venda */
function comRate(total){ return total>1000 ? 0.08 : 0.05; }
function monthKey(t){ const d=new Date(t); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'); }
function monthLabel(t){ return new Date(t).toLocaleDateString('pt-BR',{month:'long',year:'numeric'}); }
function comissaoMensalMap(list){ const m={}; list.forEach(o=>{const k=monthKey(o.recebidoAt||o.createdAt); m[k]=(m[k]||0)+o.total;}); return m; }
function comissaoAcumulada(list){ const m=comissaoMensalMap(list); return Object.values(m).reduce((s,t)=>s+t*comRate(t),0); }
function precoDe(p){ return Math.min(...p.tamanhos.map(t=>t.preco)); }

    <g transform='translate(150,150)' fill='none' stroke='#ffffff' stroke-opacity='.9' stroke-width='6' stroke-linecap='round'>

    <line x1='0' y1='-24' x2='0' y2='-10'/>

// QR fake decorativo para a tela de Pix
function pixQr(){
  let cells='';const n=21;const seed='bhadrampix';let h=0;for(let i=0;i<seed.length;i++)h=(h*31+seed.charCodeAt(i))&0xffffff;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){h=(h*1103515245+12345)&0x7fffffff;const on=((h>>7)&1);
    const corner=(x<7&&y<7)||(x>=n-7&&y<7)||(x<7&&y>=n-7);
    if(corner){ if((x<7&&y<7&&(x===0||x===6||y===0||y===6||(x>=2&&x<=4&&y>=2&&y<=4)))||(x>=n-7&&y<7&&(x===n-7||x===n-1||y===0||y===6||(x>=n-5&&x<=n-3&&y>=2&&y<=4)))||(x<7&&y>=n-7&&(x===0||x===6||y===n-7||y===n-1||(x>=2&&x<=4&&y>=n-5&&y<=n-3)))) cells+=`<rect x='${x}' y='${y}' width='1' height='1'/>`; }
    else if(on) cells+=`<rect x='${x}' y='${y}' width='1' height='1'/>`;
  }
  const svg=`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 21 21' shape-rendering='crispEdges'><rect width='21' height='21' fill='#fff'/><g fill='#2a211c'>${cells}</g></svg>`;
  return 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
}

let route={name:'home', param:null};
function go(name,param){ route={name,param}; render(); window.scrollTo(0,0); }

function render(){
  const seller=DB.currentSeller();
  if(!seller){ app.innerHTML=viewLogin(); return; }
  let body='';
  switch(route.name){
    case 'home': body=viewHome(seller); break;
    case 'catalog': body=viewCatalog(seller); break;
    case 'product': body=viewProduct(route.param); break;
    case 'cart': body=viewCart(seller); break;
    case 'payment': body=viewPayment(seller); break;
    case 'success': body=viewSuccess(route.param); break;
    case 'clients': body=viewClients(seller); break;
    case 'orders': body=viewOrders(seller); break;
    case 'orderDetail': body=viewOrderDetail(route.param); break;
    case 'commission': body=viewCommission(seller); break;
    default: body=viewHome(seller);
  }
  app.innerHTML = body + '<div style="height:calc(96px + env(safe-area-inset-bottom,0px))"></div>' + tabbar();
}

async function saveClient(returnTo){
  const nome=el('nc_nome').value.trim(), tel=el('nc_tel').value.trim();
  if(!nome){ toast('Informe o nome'); return; }
  if(!tel){ toast('Informe o telefone'); return; }
  const c=await DB.addClient({nome, telefone:tel, doc:el('nc_doc').value.trim(), endereco:el('nc_end').value.trim(), obs:el('nc_obs').value.trim()});
  if(!c) return;
  closeSheet();

  ORDER_DRAFT.clientId=c.id; toast('Cliente cadastrado e selecionado'); render();
}

async function finishOrder(){

/* ---- SUCESSO / RECIBO + WHATSAPP ---- */
function waMessage(o){
  const seller=DB.currentSeller()||DB._load().sellers.find(s=>s.id===o.sellerId);
  const cli=DB.client(o.clientId);
  let m=`*NOVO PEDIDO — ${DB.settings().empresa}*%0A`;
  m+=`Pedido: *${o.codigo}*%0A`;
  m+=`Vendedor(a): ${seller?seller.nome:''}%0A`;
  m+=`%0A*Cliente*%0A${cli?cli.nome:''}%0A${cli&&cli.telefone?('Tel: '+cli.telefone+'%0A'):''}${cli&&cli.endereco?('Entrega: '+cli.endereco+'%0A'):''}${cli&&cli.obs?('Obs: '+cli.obs+'%0A'):''}`;
  m+=`%0A*Itens*%0A`;
  o.items.forEach(i=>{ const det=[i.tamanho,i.aroma].filter(Boolean).join(' · '); m+=`• ${i.qty}x ${i.nome}${det?(' ('+det+')'):''} — ${money(i.preco*i.qty)}%0A`; });
  m+=`%0A*Total: ${money(o.total)}*%0A`;
  m+=`Pagamento: ${o.pagamento}%0A`;
  return m.replace(/ /g,'%20');
}
function sendWhatsExp(id){
  const exps=DB.settings().expedicao;
  if(exps.length>1){
    openSheet(`<div class="sh-head"><h3>Enviar para qual expedição?</h3><span class="cls" onclick="closeSheet()">×</span></div>
      <div style="padding:0 16px">
      ${exps.map((e,i)=>`<button class="cust-pick" onclick="__expSend('${id}',${i})"><span class="avatar">📲</span><span class="li-main"><span class="t">${esc(e.nome)}</span><span class="s">${esc(e.numero.replace(/^55/,''))}</span></span><span class="chev">›</span></button>`).join('')}
      <div style="height:8px"></div></div>`);
  } else { __expOpen(id, exps[0].numero); }
}
function __expSend(id,i){ closeSheet(); __expOpen(id, DB.settings().expedicao[i].numero); }
async function __expOpen(id, numero){
  const o=DB.order(id);
  window.open(`https://wa.me/${numero.replace(/\D/g,'')}?text=${waMessage(o)}`,'_blank');
  toast('Abrindo WhatsApp da expedição...');
  await DB.updateOrder(id,{status:'enviado', enviadoAt:Date.now()});
  go('orderDetail',id);
}

  o.items.forEach(i=>{ const det=[i.tamanho,i.aroma].filter(Boolean).join(' · '); m+=`• ${i.qty}x ${i.nome}${det?(' ('+det+')'):''} — ${money(i.preco*i.qty)}%0A`; });

    </div>
    <div class="section-title">Por mês (confirmados)</div>
    ${meses.length?meses.map(k=>{const t=mapMes[k];const tx=comRate(t);const lbl=monthLabel(k+'-15');return `<div class="list-item">
        <div class="li-main"><div class="t" style="text-transform:capitalize">${esc(lbl)}</div><div class="s">Vendas ${money(t)} • taxa ${(tx*100).toFixed(0)}%</div></div>

  </div>`;
}

/* ---------- START ---------- */
async function bootstrap(){
  app.innerHTML='<div style="display:flex;height:100vh;align-items:center;justify-content:center;color:var(--muted);font-weight:600">Carregando…</div>';
  try{
    const logged=await DB.restoreSession();
    if(logged){ await DB.loadAll(); }
  }catch(e){ console.error(e); }
  render();
}
bootstrap();
</script>
</body>
</html>
