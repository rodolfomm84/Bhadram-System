<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2b3620">
<title>Bhadram Gestão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#5c7a4f; --brand-2:#425a37; --brand-soft:#e9f0e3; --brand-soft2:#f1f5ec;
  --ink:#2b3620; --ink-2:#48583c; --bg:#f4f5ef; --card:#ffffff;
  --line:#e4e7db; --line-2:#eef0e8; --muted:#83887a; --text:#2b3620;
  --ok:#3f8f5f; --ok-soft:#e4f2e9; --warn:#c9962f; --warn-soft:#f9efd6;
  --danger:#c0503f; --danger-soft:#f7e6e2; --info:#3f6f8f; --info-soft:#e4eef4;
  --shadow:0 6px 24px rgba(43,54,32,.08); --shadow-sm:0 1px 4px rgba(43,54,32,.06);
  --r:14px; --r-sm:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:'Manrope',system-ui,sans-serif;background:var(--bg);color:var(--text);font-size:14.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:'Cormorant Garamond',serif;margin:0;font-weight:700}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:14px}
img{display:block;max-width:100%}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:#d3d8ca;border-radius:6px;border:2px solid var(--bg)}

.admin{display:flex;min-height:100vh}
/* Sidebar */
.sidebar{width:236px;flex-shrink:0;background:linear-gradient(180deg,#2b3620,#374527);color:#fff;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:20px 14px}
.sidebar .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 18px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:12px}
.sidebar .brand img{height:38px;width:auto}
.sidebar .brand .nm{font-family:'Cormorant Garamond',serif;font-size:22px;line-height:1}
.sidebar .brand .nm small{display:block;font-family:'Manrope';font-size:8.5px;letter-spacing:3px;color:#a9c48f;font-weight:600;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto;flex:1}
.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 12px;border-radius:10px;color:#cdd6c0;font-weight:600;font-size:14px;text-align:left;transition:.12s}
.nav button svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;flex-shrink:0}
.nav button:hover{background:rgba(255,255,255,.07);color:#fff}
.nav button.active{background:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(92,122,79,.4)}
.nav .badge-n{margin-left:auto;background:#c0503f;color:#fff;font-size:11px;font-weight:800;border-radius:999px;padding:1px 7px}
.nav button.active .badge-n{background:rgba(255,255,255,.25)}
.sidebar .foot{font-size:11px;color:#8c9a7c;padding:12px 8px 0;border-top:1px solid rgba(255,255,255,.1);margin-top:8px}

/* Main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{background:var(--card);border-bottom:1px solid var(--line);padding:16px 26px;display:flex;align-items:center;gap:16px;position:sticky;top:0;z-index:10}
.topbar h1{font-size:25px}
.topbar .sub{color:var(--muted);font-size:13px;margin-left:2px}
.topbar .right{margin-left:auto;display:flex;align-items:center;gap:14px}
.topbar .date{font-size:13px;color:var(--muted)}
.topbar .who{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13.5px}
.topbar .who .av{width:34px;height:34px;border-radius:50%;background:var(--brand-soft);color:var(--brand-2);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Cormorant Garamond',serif}
.content{padding:24px 26px 60px;max-width:1240px;width:100%}

/* Cards & grid */
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(4,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow-sm)}
.card.pad{padding:18px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden}
.kpi .k{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.3px;display:flex;align-items:center;gap:7px}
.kpi .v{font-family:'Cormorant Garamond',serif;font-size:31px;font-weight:700;color:var(--ink);line-height:1.05;margin-top:6px}
.kpi .d{font-size:12px;color:var(--muted);margin-top:3px}
.kpi.accent{background:linear-gradient(150deg,#2b3620,#3f5130);border-color:transparent;color:#fff}
.kpi.accent .k{color:#c6d3b5}.kpi.accent .v{color:#fff}.kpi.accent .d{color:#a9c48f}
.kpi .ic{position:absolute;right:14px;top:14px;font-size:18px;opacity:.5}
.sec-title{font-size:12px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:26px 2px 12px}
.sec-title:first-child{margin-top:4px}
.row{display:flex;gap:16px}.row>*{flex:1}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}

/* Tables */
.tbl-wrap{overflow-x:auto;border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
thead th{text-align:left;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);font-weight:800;padding:11px 14px;border-bottom:1.5px solid var(--line);white-space:nowrap;background:var(--card);position:sticky;top:0}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:hover{background:var(--brand-soft2)}
tbody tr:last-child td{border-bottom:none}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.t-strong{font-weight:700;color:var(--ink)}
.t-sub{font-size:12px;color:var(--muted)}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.badge .dot{width:6px;height:6px;border-radius:50%;background:currentColor}
.b-novo{background:var(--info-soft);color:#2f5f7c}
.b-sep{background:var(--warn-soft);color:#946f16}
.b-env{background:#e7e0f2;color:#5b4b86}
.b-entr{background:var(--ok-soft);color:#2b6b45}
.b-ok{background:var(--ok-soft);color:#2b6b45}
.b-low{background:var(--danger-soft);color:#a53b2b}
.b-mid{background:var(--warn-soft);color:#946f16}
.b-pago{background:var(--ok-soft);color:#2b6b45}
.b-pend{background:var(--warn-soft);color:#946f16}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:10px;font-weight:700;font-size:13.5px;transition:.13s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-2)}
.btn-dark{background:var(--ink);color:#fff}
.btn-outline{background:#fff;border:1.5px solid var(--line);color:var(--ink)}
.btn-outline:hover{border-color:var(--brand);color:var(--brand-2)}
.btn-wa{background:#25D366;color:#fff}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:8px}
.btn-ghost{background:var(--brand-soft);color:var(--brand-2)}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{padding:7px 13px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ink-2);white-space:nowrap}
.chip.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.search{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;min-width:220px}
.search input{border:none;outline:none;width:100%;background:none}
select.inp{padding:9px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-weight:600}

/* Fields */
.field{margin-bottom:13px}
.field label{display:block;font-size:12px;font-weight:700;color:var(--ink-2);margin:0 2px 6px}
.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;outline:none;color:var(--text)}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(92,122,79,.13)}
.field .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* Progress bar */
.pbar{height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.pbar > i{display:block;height:100%;border-radius:4px;background:var(--brand)}

/* Mini bar chart */
.chart{display:flex;align-items:flex-end;gap:14px;height:150px;padding:8px 4px 0}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.chart .bars{display:flex;gap:4px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.chart .bar{width:16px;border-radius:5px 5px 0 0}
.chart .bi{background:var(--brand)}.chart .bo{background:#cdbf9a}
.chart .lbl{font-size:11px;color:var(--muted);font-weight:700}

/* Modal / drawer */
.mask{position:fixed;inset:0;background:rgba(30,36,22,.5);z-index:50;opacity:0;pointer-events:none;transition:.2s}
.mask.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:440px;max-width:94vw;background:var(--bg);z-index:51;transform:translateX(100%);transition:.28s cubic-bezier(.2,.8,.2,1);overflow-y:auto;box-shadow:-10px 0 40px rgba(0,0,0,.15)}
.drawer.show{transform:none}
.drawer .dh{position:sticky;top:0;background:var(--ink);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:12px;z-index:2}
.drawer .dh h3{font-size:21px;color:#fff}
.drawer .dh .cls{margin-left:auto;font-size:26px;color:#cdd6c0;width:30px;text-align:right;line-height:1}
.drawer .db{padding:18px 20px}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);z-index:51;background:var(--bg);border-radius:16px;width:440px;max-width:94vw;max-height:90vh;overflow-y:auto;opacity:0;pointer-events:none;transition:.18s;box-shadow:var(--shadow)}
.modal.show{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal .mh{padding:18px 20px 4px;display:flex;align-items:center}
.modal .mh h3{font-size:21px}.modal .mh .cls{margin-left:auto;font-size:24px;color:var(--muted);width:30px;text-align:right}
.modal .mb{padding:8px 20px 20px}

.toast{position:fixed;right:24px;bottom:24px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;z-index:80;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);transition:.22s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty .ic{font-size:40px;opacity:.5}.empty .t{font-weight:700;color:var(--ink-2);margin-top:8px}
.dl{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line-2);font-size:13.5px}
.dl:last-child{border-bottom:none}.dl .k{color:var(--muted)}.dl .v{font-weight:700;color:var(--ink);text-align:right}
.hamb{display:none}

@media(max-width:900px){
  .admin{flex-direction:column}
  .sidebar{width:100%;height:auto;position:sticky;top:0;flex-direction:row;align-items:center;padding:10px 12px;z-index:20}
  .sidebar .brand{border:none;margin:0;padding:0 8px 0 4px;flex-shrink:0}
  .sidebar .brand .nm{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav button{padding:9px 11px;white-space:nowrap}.nav button span.lb{display:none}
  .nav button svg{width:21px;height:21px}
  .sidebar .foot{display:none}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .content{padding:16px 14px 50px}
  .topbar{padding:13px 16px}.topbar .right .date{display:none}
}
@media(max-width:560px){ .kpis{grid-template-columns:1fr} .row{flex-direction:column} }
</style>

function tms(v){ return v ? new Date(v).getTime() : null; }
function mapPedido(r){
  const items=(r.pedido_itens||[]).map(i=>({productId:i.produto_id,nome:i.produto_nome,tamanho:i.tamanho,aroma:i.aroma,preco:Number(i.preco),qty:i.qtd}));
  return {id:r.id,codigo:r.codigo,sellerId:r.vendedor_id,clientId:r.cliente_id,items,total:Number(r.total),
          pagamento:r.pagamento,status:r.status,pago:r.pago,_baixado:r.status==='enviado'||r.status==='entregue',
          createdAt:tms(r.criado_em),enviadoAt:tms(r.enviado_em),recebidoAt:tms(r.entregue_em)};
}
function mapSku(r){ return {sku:r.id,productId:r.produto_id,produto:r.produtos?r.produtos.nome:r.produto_id,
  cat:r.produtos?r.produtos.categoria:'',tamanho:r.tamanhos?r.tamanhos.rotulo:'',aroma:r.aromas?r.aromas.nome:'',
  preco:r.tamanhos?Number(r.tamanhos.preco):0,qtd:r.qtd,minimo:r.minimo}; }
function mapCliente(r){ return {id:r.id,nome:r.nome,telefone:r.telefone||'',endereco:r.endereco||'',documento:r.documento||'',sellerId:r.vendedor_id}; }
function mapFin(r){ return {id:r.id,data:tms(r.data),tipo:r.tipo,categoria:r.categoria,descricao:r.descricao,valor:Number(r.valor),conta:r.conta_id,orderId:r.pedido_id}; }

const C={ skus:[], sellers:[], clients:[], suppliers:[], orders:[], fin:[], banks:[], comPays:[], settings:{expedicao:[],empresa:'Bhadram'}, seller:null };

const DB={
  // ---- getters (cache) ----
  orders(){return C.orders.slice().sort((a,b)=>b.createdAt-a.createdAt);},
  order(id){return C.orders.find(o=>o.id===id);},
  skus(){return C.skus;},
  sku(id){return C.skus.find(s=>s.sku===id);},
  sellers(){return C.sellers;},
  seller(id){return C.sellers.find(s=>s.id===id);},
  clients(){return C.clients;},
  client(id){return C.clients.find(c=>c.id===id);},
  suppliers(){return C.suppliers;},
  fin(){return C.fin.slice().sort((a,b)=>b.data-a.data);},
  banks(){return C.banks;},
  comPays(){return C.comPays;},
  settings(){return C.settings;},
  currentUser(){return C.seller;},

  // ---- auth ----
  async signIn(email,senha){
    const {data,error}=await SB.auth.signInWithPassword({email:email.trim(),password:senha});
    if(error) return {error:error.message};
    const {data:perfil}=await SB.from('perfis').select('*').eq('id',data.user.id).single();
    if(!perfil || perfil.papel!=='admin'){ await SB.auth.signOut(); return {error:'Acesso restrito ao administrador.'}; }
    C.seller={id:data.user.id,nome:perfil.nome,papel:perfil.papel};
    return {ok:true};
  },
  async restoreSession(){
    const {data}=await SB.auth.getSession();
    if(data && data.session){
      const {data:perfil}=await SB.from('perfis').select('*').eq('id',data.session.user.id).single();
      if(perfil && perfil.papel==='admin'){ C.seller={id:data.session.user.id,nome:perfil.nome,papel:'admin'}; return true; }
    }
    return false;
  },
  async signOut(){ await SB.auth.signOut(); C.seller=null; },

  // ---- carga ----
  async loadAll(){
    const [cfg,perfis,skus,cli,forn,ped,fin,contas,comp]=await Promise.all([
      SB.from('config').select('*'),
      SB.from('perfis').select('*'),
      SB.from('skus').select('id,qtd,minimo,produto_id, produtos(nome,categoria), tamanhos(rotulo,preco), aromas(nome)'),
      SB.from('clientes').select('*'),
      SB.from('fornecedores').select('*'),
      SB.from('pedidos').select('*, pedido_itens(*)'),
      SB.from('financeiro').select('*'),
      SB.from('contas').select('*'),
      SB.from('comissao_pagamentos').select('*')
    ]);
    const m={}; (cfg.data||[]).forEach(r=>m[r.chave]=r.valor);
    C.settings={empresa:m.empresa||'Bhadram', expedicao:m.expedicao||[]};
    C.sellers=(perfis.data||[]).map(p=>({id:p.id,nome:p.nome,papel:p.papel,telefone:p.telefone}));
    C.skus=(skus.data||[]).map(mapSku);
    C.clients=(cli.data||[]).map(mapCliente);
    C.suppliers=(forn.data||[]).map(f=>({id:f.id,nome:f.nome,categoria:f.categoria,telefone:f.telefone,contato:f.contato}));
    C.orders=(ped.data||[]).map(mapPedido);
    C.fin=(fin.data||[]).map(mapFin);
    C.banks=(contas.data||[]).map(b=>({id:b.id,nome:b.nome,banco:b.banco,tipo:b.tipo,saldoInicial:Number(b.saldo_inicial)}));
    C.comPays=(comp.data||[]).map(c=>({id:c.id,sellerId:c.vendedor_id,valor:Number(c.valor),data:tms(c.data),referencia:c.referencia}));
  },
  async reloadOrders(){
    const {data}=await SB.from('pedidos').select('*, pedido_itens(*)');
    if(data) C.orders=data.map(mapPedido);
  },
  async reloadFin(){
    const {data}=await SB.from('financeiro').select('*');
    if(data) C.fin=data.map(mapFin);
  },
  async reloadSkus(){
    const {data}=await SB.from('skus').select('id,qtd,minimo,produto_id, produtos(nome,categoria), tamanhos(rotulo,preco), aromas(nome)');
    if(data) C.skus=data.map(mapSku);
  },

  // ---- mutações (cache otimista + persiste no banco) ----
  async setOrderStatus(id,status){
    const o=this.order(id); if(!o) return;
    const prev=o.status; o.status=status;
    const upd={status};
    if(status==='enviado'){ upd.enviado_em=new Date().toISOString(); if(!o._baixado){ o._baixado=true; this._baixarCacheEstoque(o); } }
    if(status==='entregue'){ upd.entregue_em=new Date().toISOString(); if(!o.pago){ o.pago=true; upd.pago=true; this._addFinCache({tipo:'entrada',categoria:'Vendas',descricao:'Pedido '+o.codigo,valor:o.total,conta:'conta',orderId:o.id}); } }
    const {error}=await SB.from('pedidos').update(upd).eq('id',id);
    if(error){ o.status=prev; toast('Erro ao atualizar pedido'); return; }
    if(status==='enviado'){ // baixa de estoque no banco
      for(const it of o.items){ const s=this.sku(it.productId+'|'+it.tamanho+'|'+it.aroma); if(s){ await SB.from('skus').update({qtd:s.qtd}).eq('id',s.sku); } }
    }
    if(status==='entregue'){ await SB.from('financeiro').insert({tipo:'entrada',categoria:'Vendas',descricao:'Pedido '+o.codigo,valor:o.total,conta_id:'conta',pedido_id:o.id}); await this.reloadFin(); }
  },
  _baixarCacheEstoque(o){ o.items.forEach(it=>{ const s=this.sku(it.productId+'|'+it.tamanho+'|'+it.aroma); if(s) s.qtd=Math.max(0,s.qtd-it.qty); }); },
  _addFinCache(e){ C.fin.push({id:'tmp'+Date.now(),data:Date.now(),...e}); },
  async adjustStock(skuId,delta){ const s=this.sku(skuId); if(!s) return; s.qtd=Math.max(0,s.qtd+delta); const {error}=await SB.from('skus').update({qtd:s.qtd}).eq('id',skuId); if(error) toast('Erro ao salvar estoque'); },
  async setStock(skuId,val){ const s=this.sku(skuId); if(!s) return; s.qtd=Math.max(0,val|0); await SB.from('skus').update({qtd:s.qtd}).eq('id',skuId); },
  async addFin(e){ const tmp={id:'tmp'+Date.now(),data:e.data||Date.now(),tipo:e.tipo,categoria:e.categoria,descricao:e.descricao,valor:e.valor,conta:e.conta,orderId:null}; C.fin.push(tmp);
    const {data,error}=await SB.from('financeiro').insert({tipo:e.tipo,categoria:e.categoria,descricao:e.descricao,valor:e.valor,conta_id:e.conta,data:new Date(tmp.data).toISOString()}).select().single();
    if(error){ toast('Erro ao salvar lançamento'); } else { const i=C.fin.findIndex(x=>x.id===tmp.id); if(i>=0) C.fin[i]=mapFin(data); } },
  async delFin(id){ const i=C.fin.findIndex(x=>x.id===id); if(i>=0) C.fin.splice(i,1); if(!(''+id).startsWith('tmp')) await SB.from('financeiro').delete().eq('id',id); },
  async addSupplier(s){ const tmp={id:'tmp'+Date.now(),...s}; C.suppliers.push(tmp);
    const {data,error}=await SB.from('fornecedores').insert({nome:s.nome,categoria:s.categoria,telefone:s.telefone,contato:s.contato}).select().single();
    if(!error&&data){ const i=C.suppliers.findIndex(x=>x.id===tmp.id); if(i>=0) C.suppliers[i]={id:data.id,nome:data.nome,categoria:data.categoria,telefone:data.telefone,contato:data.contato}; } },
  async addClient(c){ const tmp={id:'tmp'+Date.now(),nome:c.nome,telefone:c.telefone,endereco:c.endereco,sellerId:c.sellerId}; C.clients.push(tmp);
    const {data,error}=await SB.from('clientes').insert({nome:c.nome,telefone:c.telefone,endereco:c.endereco,vendedor_id:c.sellerId}).select().single();
    if(!error&&data){ const i=C.clients.findIndex(x=>x.id===tmp.id); if(i>=0) C.clients[i]=mapCliente(data); } },
  async payCommission(sellerId,valor){ const ref=new Date().toISOString().slice(0,7);
    C.comPays.push({id:'tmp'+Date.now(),sellerId,valor,data:Date.now(),referencia:ref});
    C.fin.push({id:'tmp'+Date.now()+'f',data:Date.now(),tipo:'saida',categoria:'Comissões',descricao:'Comissão '+((this.seller(sellerId)||{}).nome||''),valor,conta:'conta',orderId:null});
    await SB.from('comissao_pagamentos').insert({vendedor_id:sellerId,valor,referencia:ref});
    await SB.from('financeiro').insert({tipo:'saida',categoria:'Comissões',descricao:'Comissão '+((this.seller(sellerId)||{}).nome||''),valor,conta_id:'conta'});
    await Promise.all([this.reloadFin()]); }
}

/* ---------- Cálculos derivados ---------- */
function bankSaldo(bankId){ const b=DB.banks().find(x=>x.id===bankId); let s=b?b.saldoInicial:0;
  DB.fin().forEach(f=>{ if(f.conta===bankId) s+=(f.tipo==='entrada'?f.valor:-f.valor); }); return s; }
function saldoTotal(){ return DB.banks().reduce((s,b)=>s+bankSaldo(b.id),0); }
function totalEntradas(from){ return DB.fin().filter(f=>f.tipo==='entrada'&&(!from||f.data>=from)).reduce((s,f)=>s+f.valor,0); }
function totalSaidas(from){ return DB.fin().filter(f=>f.tipo==='saida'&&(!from||f.data>=from)).reduce((s,f)=>s+f.valor,0); }
function contasReceber(){ return DB.orders().filter(o=>!o.pago).reduce((s,o)=>s+o.total,0); }
function novosPedidos(){ return DB.orders().filter(o=>o.status==='novo').length; }
function estoqueBaixo(){ return DB.skus().filter(s=>s.qtd<s.minimo); }
function comissaoSeller(sellerId){ // comissão por TOTAL MENSAL do vendedor
  const ent=DB.orders().filter(o=>o.sellerId===sellerId&&o.status==='entregue');
  const meses={}; ent.forEach(o=>{const k=monthKey(o.recebidoAt||o.createdAt); meses[k]=(meses[k]||0)+o.total;});
  const gerada=Object.values(meses).reduce((s,t)=>s+t*comRate(t),0);
  const paga=DB.comPays().filter(c=>c.sellerId===sellerId).reduce((s,c)=>s+c.valor,0);
  return {gerada, paga, aberto:Math.max(0,gerada-paga), vendas:ent.reduce((s,o)=>s+o.total,0), qtd:ent.length, meses};
}

async function adminLogin(){
  const e=el('aemail').value,p=el('apass').value;
  if(!e||!p){el('loginErr').textContent='Informe e-mail e senha.';return;}
  const b=el('aLoginBtn');b.textContent='Entrando...';b.setAttribute('disabled','');el('loginErr').textContent='';
  const r=await DB.signIn(e,p);
  if(r.ok){ await DB.loadAll(); subscribeRealtime(); startPolling(); view='dash'; render(); }
  else { b.textContent='Entrar';b.removeAttribute('disabled'); el('loginErr').textContent=/Invalid login/i.test(r.error||'')?'E-mail ou senha incorretos.':(r.error||'Não foi possível entrar.'); }
}
async function adminLogout(){ if(confirm('Deseja sair da conta?')){ await DB.signOut(); location.reload(); } }
let RT=null;
function subscribeRealtime(){
  if(RT) return;
  try{
    RT=SB.channel('bhadram-rt')
      .on('postgres_changes',{event:'*',schema:'public',table:'pedidos'}, async (payload)=>{
        await DB.reloadOrders();
        if(payload && payload.eventType==='INSERT') toast('🔔 Novo pedido recebido!');
        maybeRender();
      })
      .subscribe();
  }catch(e){ console.warn('realtime indisponível',e); }
}
let POLL=null;
function startPolling(){
  if(POLL) return;
  POLL=setInterval(async ()=>{
    try{
      const before=C.orders.map(o=>o.id+':'+o.status+':'+o.pago).join('|');
      await DB.reloadOrders();
      const after=C.orders.map(o=>o.id+':'+o.status+':'+o.pago).join('|');
      if(before!==after) maybeRender();
    }catch(e){}
  }, 20000);
}
function maybeRender(){
  // não re-renderiza se houver janela aberta (para não atrapalhar edição)
  if(el('drawer').classList.contains('show')||el('modal').classList.contains('show')) return;
  render();
}
const TITLES={dash:['Visão geral','Resumo do seu negócio'],pedidos:['Pedidos','Pedidos recebidos dos vendedores'],estoque:['Estoque','Controle por produto, tamanho e aroma'],financeiro:['Financeiro','Fluxo de caixa, entradas e saídas'],banco:['Banco','Contas e saldos'],clientes:['Clientes','Base de clientes'],fornecedores:['Fornecedores','Seus fornecedores de insumos'],comissoes:['Comissões','Apuração por vendedor']};

function render(){
  if(!C.seller){ el('app').innerHTML=viewLogin(); return; }
  const t=TITLES[view];
  let body='';
  if(view==='dash')body=viewDash();
  else if(view==='pedidos')body=viewPedidos();
  else if(view==='estoque')body=viewEstoque();
  else if(view==='financeiro')body=viewFinanceiro();
  else if(view==='banco')body=viewBanco();
  else if(view==='clientes')body=viewClientes();
  else if(view==='fornecedores')body=viewFornecedores();
  else if(view==='comissoes')body=viewComissoes();
  el('app').innerHTML=sidebar()+`<div class="main">
    <div class="topbar"><div><h1>${t[0]}</h1></div><div class="sub">${t[1]}</div>
      <div class="right"><div class="date">${new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}</div>
      <div class="who"><span class="av">${initials(C.seller.nome)}</span>${esc(C.seller.nome.split(' ')[0])}</div></div></div>
    <div class="content">${body}</div></div>`;
}

  const chart=months.map(m=>{const k=m.getFullYear()+'-'+(m.getMonth()+1);
    let e=0,s=0;DB.fin().forEach(f=>{if(monthKey(f.data)===k){if(f.tipo==='entrada')e+=f.valor;else s+=f.valor;}});
    return {lb:m.toLocaleDateString('pt-BR',{month:'short'}).replace('.',''),e,s};});

  <div class="grid kpis">

    <div class="kpi"><div class="k">Faturamento (30 dias)</div><div class="v">${money(fatMes)}</div><div class="d">${money(totalSaidas(mesFrom))} em saídas</div><div class="ic">📈</div></div>
    <div class="kpi"><div class="k">Pedidos novos</div><div class="v">${novosPedidos()}</div><div class="d">a processar</div><div class="ic">📥</div></div>
    <div class="kpi"><div class="k">A receber</div><div class="v">${money(contasReceber())}</div><div class="d">pedidos não pagos</div><div class="ic">⏳</div></div>
  </div>

  <div class="row" style="margin-top:16px;align-items:stretch">
    <div class="card pad" style="flex:1.6">
      <div class="between"><h3 style="font-size:19px">Fluxo de caixa — 6 meses</h3>
        <div style="font-size:12px;color:var(--muted)"><span style="color:var(--brand);font-weight:800">■</span> Entradas &nbsp; <span style="color:#c2b487;font-weight:800">■</span> Saídas</div></div>
      <div class="chart">${chart.map(c=>`<div class="col"><div class="bars">
        <div class="bar bi" style="height:${Math.round(c.e/mx*100)}%" title="Entradas ${money(c.e)}"></div>
        <div class="bar bo" style="height:${Math.round(c.s/mx*100)}%" title="Saídas ${money(c.s)}"></div></div>
        <div class="lbl">${c.lb}</div></div>`).join('')}</div>
    </div>
    <div class="card pad" style="flex:1">

  <div class="sec-title">Por vendedor</div>
  <div class="row" style="align-items:stretch">${vends.length?vends.map(v=>{const c=comissaoSeller(v.id);
    return `<div class="card pad"><div class="between"><div style="display:flex;align-items:center;gap:11px"><span style="width:42px;height:42px;border-radius:12px;background:var(--brand-soft);color:var(--brand-2);display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Cormorant Garamond',serif;font-size:17px">${initials(v.nome)}</span><div><div class="t-strong" style="font-size:16px">${esc(v.nome)}</div><div class="t-sub">${c.qtd} pedidos entregues</div></div></div></div>
      <div style="margin-top:14px">
        <div class="dl"><span class="k">Vendas confirmadas</span><span class="v">${money(c.vendas)}</span></div>
        <div class="dl"><span class="k">Comissão gerada</span><span class="v">${money(c.gerada)}</span></div>
        <div class="dl"><span class="k">Já paga</span><span class="v">${money(c.paga)}</span></div>
        <div class="dl"><span class="k" style="font-weight:800">A pagar</span><span class="v" style="font-size:17px;color:var(--brand-2)">${money(c.aberto)}</span></div>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:12px" ${c.aberto<=0?'disabled':''} onclick="pagarComissao('${v.id}',${c.aberto})">Registrar pagamento (${money(c.aberto)})</button>
    </div>`;}).join(''):'<div class="empty" style="flex:1"><div class="t">Nenhum vendedor cadastrado ainda</div><div class="d">Crie usuários com papel \'vendedor\' no Supabase.</div></div>'}</div>
  <div class="sec-title">Comissão por mês (por vendedor)</div>
  <div class="card tbl-wrap"><table><thead><tr><th>Vendedor</th><th>Mês</th><th class="num">Vendas no mês</th><th class="num">Taxa</th><th class="num">Comissão</th></tr></thead>
  <tbody>${(function(){let rows='';vends.forEach(v=>{const c=comissaoSeller(v.id);Object.keys(c.meses).sort().reverse().forEach(k=>{const t=c.meses[k];const tx=comRate(t);const pr=k.split('-');const lbl=new Date(pr[0],pr[1]-1,1).toLocaleDateString('pt-BR',{month:'long',year:'numeric'});rows+=`<tr><td class="t-strong">${esc(v.nome)}</td><td class="t-sub" style="text-transform:capitalize">${esc(lbl)}</td><td class="num">${money(t)}</td><td class="num">${(tx*100).toFixed(0)}%</td><td class="num t-strong" style="color:var(--brand-2)">${money(t*tx)}</td></tr>`;});});return rows||'<tr><td colspan="5"><div class="empty"><div class="t">Sem entregas ainda</div></div></td></tr>';})()}</tbody></table></div>`;
}
function pagarComissao(id,val){if(val<=0)return;DB.payCommission(id,val);toast('Pagamento de comissão registrado');render();}

/* ---------- Drawer/Modal ---------- */
function openDrawer(html){el('drawer').innerHTML=html;el('mask').classList.add('show');el('drawer').classList.add('show');}
function openModal(html){el('modal').innerHTML=html;el('mask').classList.add('show');el('modal').classList.add('show');}
function closeModal(){el('modal').classList.remove('show');if(!el('drawer').classList.contains('show'))el('mask').classList.remove('show');}
function closeAll(){el('mask').classList.remove('show');el('drawer').classList.remove('show');el('modal').classList.remove('show');}

async function bootstrap(){
  el('app').innerHTML='<div style="flex:1;min-height:100vh;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:600">Carregando…</div>';
  try{ const ok=await DB.restoreSession(); if(ok){ await DB.loadAll(); subscribeRealtime(); startPolling(); } }
  catch(e){ console.error(e); }
  render();
}
bootstrap();
</script>
</body>
</html>
